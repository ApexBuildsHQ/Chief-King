name: Build Mega Dictionary

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install deep-translator

      - name: Run dictionary builder script
        run: python -u build_dict.py # 👈 تم إضافة -u هنا لطباعة المخرجات مباشرة

      - name: Commit and push generated dictionary
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add ingredients_dict.json
          git diff-index --quiet HEAD || git commit -m "Auto-generate ingredients_dict.json"
          git push

