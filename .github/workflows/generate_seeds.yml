name: Chief King - Complete Auto Pipeline

on:
  workflow_dispatch:

jobs:
  run-full-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: |
          npm install @google/generative-ai dotenv groq-sdk

      - name: Fetch & Filter Top Open Recipes
        run: python fetch_open_dataset.py

      - name: Run SEO Matching Engine
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_KEY_4: ${{ secrets.GEMINI_KEY_4 }}
        run: node generate_seo_seeds.js

      - name: Commit and Push Updated Recipes
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "auto: fetched top open recipes and optimized SEO titles"
          file_pattern: "*.json"
