name: Generate SEO Recipes JSON-LD with Official Images

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-process:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas kaggle requests beautifulsoup4

      - name: Download Food.com Dataset from Kaggle
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          kaggle datasets download -d shuyangli94/food-com-recipes-and-user-interactions
          unzip -o food-com-recipes-and-user-interactions.zip

      - name: Run Recipe Scraper Script
        run: |
          python recipes_scraper.py

      - name: Commit and Push Processed Files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add output_recipes_2/*.json
          git commit -m "Auto-generate 20,000 SEO JSON-LD recipes with official images" || echo "No changes to commit"
          git push

