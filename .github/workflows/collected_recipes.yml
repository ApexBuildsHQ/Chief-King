name: Generate SEO Recipes JSON-LD (Output Recipes 2)

on:
  workflow_dispatch: # يتيح تشغيل السكريبت يدوياً من واجهة GitHub Actions

permissions:
  contents: write # إعطاء صلاحيات الكتابة والـ Push لـ GitHub Actions

jobs:
  build-and-process:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas kaggle

      - name: Download Food.com Dataset from Kaggle
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          kaggle datasets download -d shuyangli94/food-com-recipes-and-user-interactions
          unzip -o food-com-recipes-and-user-interactions.zip

      - name: Run Collected Recipes Script
        run: |
          python collected_recipes.py

      - name: Commit and Push Processed Files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add output_recipes_2/*.json
          git commit -m "Auto-generate 20,000 SEO JSON-LD categorized recipes [output_recipes_2]" || echo "No changes to commit"
          git push

