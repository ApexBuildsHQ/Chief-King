name: Chief King - Fetch Open Recipes

on:
  workflow_dispatch:

jobs:
  fetch-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas pyarrow fastparquet

      - name: Run Open Dataset Fetcher
        run: python fetch_open_dataset.py

      - name: Commit and Push raw_recipes.json
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "auto: fetch and generate raw_recipes.json"
          file_pattern: "raw_recipes.json"
