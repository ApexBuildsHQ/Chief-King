name: Generate SEO Recipes JSON-LD from New Dataset

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-process:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas kaggle

      - name: Download New Dataset from Kaggle
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          kaggle datasets download -d irkaal/foodcom-recipes-and-reviews -f recipes.csv
          # فك الضغط بأمان فقط إذا كانت التبعية مضغوطة
          if [ -f "recipes.csv.zip" ]; then unzip -o recipes.csv.zip; fi

      - name: Run Processing Script
        run: |
          python king_recipes.py

      - name: Commit and Push Processed Files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add output_recipes_seo_2/*.json
          git commit -m "Auto-generate 20,000 complete recipes into output_recipes_seo_2" || echo "No changes to commit"
          git push
