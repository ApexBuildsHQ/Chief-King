name: Generate SEO Recipes JSON-LD from New Dataset

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-process:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas kaggle

      - name: Download New Dataset from Kaggle
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          echo "📥 بدء تحميل ملف البيانات من Kaggle..."
          kaggle datasets download -d irkaal/foodcom-recipes-and-reviews -f recipes.csv
          
          # فحص وفك ضغط الملف بأمان
          if [ -f "recipes.csv.zip" ]; then
            echo "📦 تم العثور على recipes.csv.zip، جاري فك الضغط..."
            unzip -o recipes.csv.zip
            rm recipes.csv.zip
          elif file recipes.csv | grep -q 'Zip archive'; then
            echo "📦 الملف recipes.csv عبارة عن Zip مضغوط، جاري فك الضغط..."
            mv recipes.csv temp_recipes.zip
            unzip -o temp_recipes.zip
            rm temp_recipes.zip
          fi

          # التأكد التام من وجود الملف النصي الحقيقي
          if [ -f "recipes.csv" ]; then
            echo "✅ تم تجهيز ملف recipes.csv النصي بنجاح!"
          else
            echo "❌ خطأ: فشل في تجهيز ملف recipes.csv"
            exit 1
          fi

      - name: Run Processing Script
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python king_recipes.py

      - name: Commit and Push Processed Files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add output_recipes_seo_2
          git commit -m "Auto-generate 20,000 complete recipes into output_recipes_seo_2" || echo "No changes to commit"
          git push
